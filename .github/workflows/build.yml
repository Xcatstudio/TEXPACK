name: Build Geode Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Geode CLI
      run: |
        pip install geode-sdk
      shell: pwsh
    
    - name: Download Geode SDK
      run: |
        git clone https://github.com/geode-sdk/geode.git geode-sdk
        cd geode-sdk
        git checkout v4.0.0
      shell: bash
    
    - name: Install Geode binaries
      run: |
        $env:GEODE_SDK = "${{ github.workspace }}\geode-sdk"
        cd geode-sdk
        geode sdk install-binaries
      shell: pwsh
    
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    
    - name: Configure CMake
      run: |
        $env:GEODE_SDK = "${{ github.workspace }}\geode-sdk"
        cmake -B build -DCMAKE_BUILD_TYPE=Release
      shell: pwsh
    
    - name: Build
      run: |
        $env:GEODE_SDK = "${{ github.workspace }}\geode-sdk"
        cmake --build build --config Release
      shell: pwsh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextureLoader-Windows
        path: build/Release/*.geode
