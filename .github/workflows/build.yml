name: Build Geode Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        config:
        - name: Windows
          os: windows-latest
          
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Geode SDK
      uses: geode-sdk/cli@main
      
    - name: Build mod
      run: |
        geode build
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: texture-loader-${{ matrix.config.name }}
        path: build/*.geode
