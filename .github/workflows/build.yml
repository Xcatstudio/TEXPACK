name: Build Geode Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    
    - name: Download Geode SDK
      run: |
        git clone https://github.com/geode-sdk/geode.git geode-sdk
        cd geode-sdk
        git checkout v4.0.0
      shell: bash
    
    - name: Download Geode Binaries
      run: |
        $GEODE_VERSION = "v4.0.0"
        $BINARIES_URL = "https://github.com/geode-sdk/geode/releases/download/$GEODE_VERSION/geode-$GEODE_VERSION-win.zip"
        
        Write-Host "Downloading Geode binaries..."
        Invoke-WebRequest -Uri $BINARIES_URL -OutFile "geode-binaries.zip"
        
        Write-Host "Extracting binaries..."
        Expand-Archive -Path "geode-binaries.zip" -DestinationPath "geode-sdk/bin" -Force
        
        Write-Host "Binaries installed successfully"
      shell: pwsh
    
    - name: Configure CMake
      run: |
        $env:GEODE_SDK = "${{ github.workspace }}\geode-sdk"
        cmake -B build -DCMAKE_BUILD_TYPE=Release
      shell: pwsh
    
    - name: Build
      run: |
        $env:GEODE_SDK = "${{ github.workspace }}\geode-sdk"
        cmake --build build --config Release
      shell: pwsh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextureLoader-Windows
        path: build/Release/*.geode
